<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FKB{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">FK<span class="accent">B</span></div>
      <nav>
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
        <a href="/signals" class="{{ 'active' if request.url.path == '/signals' else '' }}">Signals</a>
        <a href="/trades" class="{{ 'active' if request.url.path == '/trades' else '' }}">Trades</a>
        <a href="/journal" class="{{ 'active' if request.url.path == '/journal' else '' }}">Journal</a>
        <a href="/p2p" class="{{ 'active' if request.url.path == '/p2p' else '' }}">P2P</a>
      </nav>
    </div>
    <div class="topbar-right">
      <span id="engine-badge" hx-get="/partials/health" hx-trigger="load, every 10s" hx-swap="innerHTML"></span>
      <a href="/logout" class="logout">Sign out</a>
    </div>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
