<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — FKB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand">FK<span class="accent">B</span></div>
    <form method="post" action="/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" autofocus required>
      {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
